
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Help Portal - Registration</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#063b70,#1688df);
}

.register-box{
width:100%;
max-width:450px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 35px #0004;
}

h1{
text-align:center;
color:#07549b;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#66778a;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
color:#183b60;
margin-bottom:7px;
font-size:14px;
}

input{
width:100%;
padding:13px;
margin-bottom:17px;
border:1px solid #cbd8e8;
border-radius:7px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#0879e8;
}

button{
width:100%;
padding:14px;
background:#0879e8;
color:white;
border:none;
border-radius:7px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{background:#075bb0}

.bottom{
text-align:center;
margin-top:20px;
font-size:14px;
}

a{
color:#0879e8;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="register-box">

<h1>Create Account</h1>
<p class="subtitle">Register to access Student Help Portal</p>

<form id="registerForm">

<label for="name">Full Name</label>
<input type="text" id="name" placeholder="Enter your full name" required>

<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label for="college">College Name</label>
<input type="text" id="college" placeholder="Enter your college name" required>

<label for="password">Create Password</label>
<input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>

<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="6" required>

<button type="submit">REGISTER NOW</button>

</form>

<p class="bottom">
Already registered? <a href="login.html">Login Here</a>
</p>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit",function(e){

e.preventDefault();

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const college=document.getElementById("college").value.trim();
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(password!==confirmPassword){
alert("Passwords do not match!");
return;
}

const student={name,email,college,password};

localStorage.setItem("labPortalStudent",JSON.stringify(student));

alert("Registration successful! Now login.");

window.location.href="login.html";

});
</script>

</body>
</html>
