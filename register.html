
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration | Student Help Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-container">
  <a class="brand auth-brand" href="index.html">⚗ LAB <span>PORTAL</span></a>

  <div class="auth-card">
    <div class="auth-icon">🎓</div>
    <h1>Create Account</h1>
    <p class="auth-subtitle">Register to access student services</p>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>

      <label for="college">College Name</label>
      <input type="text" id="college" placeholder="Enter your college name" required>

      <label for="semester">Semester</label>
      <select id="semester" required>
        <option value="">Select your semester</option>
        <option>1st Semester</option>
        <option>2nd Semester</option>
        <option>3rd Semester</option>
        <option>4th Semester</option>
        <option>5th Semester</option>
        <option>6th Semester</option>
      </select>

      <label for="password">Create Password</label>
      <input type="password" id="password" placeholder="Create a password" minlength="6" required>

      <button type="submit" class="btn auth-submit">Create Account →</button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a href="login.html">Login Here</a>
    </p>
    <a class="back-link" href="index.html">← Back to Home</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
