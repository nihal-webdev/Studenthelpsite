
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Student Help Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-container">
  <a class="brand auth-brand" href="index.html">⚗ LAB <span>PORTAL</span></a>

  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Login to your student account</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your registered email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit" class="btn auth-submit">Login Now →</button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a href="register.html">Register Here</a>
    </p>
    <a class="back-link" href="index.html">← Back to Home</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
