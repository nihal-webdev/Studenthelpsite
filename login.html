
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Portal - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b4d85, #55a9ee);
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 35px #0003;
    }
    h1 {
      text-align: center;
      color: #1264bd;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #66778a;
      margin-bottom: 25px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #cbd8e8;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0879e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .bottom {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }
    a {
      color: #0879e8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to Lab Portal</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login Now</button>
    </form>

    <p class="bottom">New student? <a href="register.html">Register Here</a></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const savedStudent = JSON.parse(localStorage.getItem("labPortalStudent") || "null");

      if (!savedStudent) {
        alert("Please register first!");
        window.location.href = "register.html";
        return;
      }

      if (email === savedStudent.email && password === savedStudent.password) {
        sessionStorage.setItem("loggedInStudent", email);
        alert("Login successful!");
        window.location.href = "dashboard.html";
      } else {
        alert("Incorrect email or password!");
      }
    });
  </script>
</body>
</html>
